name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-
      - run: pnpm lint
      - run: pnpm lint:features
      - run: pnpm check:no-telemetry
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-
      - run: pnpm test

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contracts

  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries

  license:
    name: license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm license:headers:check
      - name: Install REUSE
        run: pipx install reuse
      - run: pnpm reuse:lint
      - run: pnpm dco:check

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history with gitleaks
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:deps

  wip-tags:
    name: wip-tags
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check @wip scenarios named in the pull request
        run: node scripts/check-wip-tags.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}

  e2e-smoke:
    name: e2e-smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      E2E_COMPOSE_PROJECT: offgrid-e2e-local
      E2E_REUSE_STACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build server image
        run: docker compose -p offgrid-e2e-local -f infra/compose/docker-compose.yml build server
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @offgrid/e2e exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @offgrid/e2e exec playwright install-deps chromium
      - name: Bring up the compose stack
        run: pnpm --filter @offgrid/e2e e2e:stack:up
      - name: Run smoke scenarios
        run: pnpm e2e:smoke
      - name: Tear down the compose stack
        if: always()
        run: pnpm --filter @offgrid/e2e e2e:stack:down
      - name: Add service logs to the job summary
        if: failure()
        run: |
          {
            echo "### Service logs (last 200 lines)"
            echo '```'
            tail -n 200 e2e/artifacts/service-logs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload traces and service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failure
          path: |
            e2e/artifacts/service-logs.txt
            e2e/artifacts/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: warn

  e2e-full:
    name: e2e-full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
        total: [1]
    env:
      E2E_COMPOSE_PROJECT: offgrid-e2e-local
      E2E_REUSE_STACK: "1"
      OFFGRID_MEMORY_BUDGET_MB: ${{ vars.OFFGRID_MEMORY_BUDGET_MB }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build server image
        run: docker compose -p offgrid-e2e-local -f infra/compose/docker-compose.yml build server
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @offgrid/e2e exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @offgrid/e2e exec playwright install-deps chromium
      - name: Bring up the compose stack
        run: pnpm --filter @offgrid/e2e e2e:stack:up
      - name: Start suite timer
        run: echo "SUITE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run full suite
        run: pnpm --filter @offgrid/e2e e2e -- --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: Report suite run time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - SUITE_STARTED_AT ))
          echo "Full suite run time: ${elapsed} s (shard ${{ matrix.shard }}/${{ matrix.total }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Report stack memory
        if: always()
        run: docker stats --no-stream --format '{{.Name}}|{{.MemUsage}}' | node scripts/stack-memory.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Tear down the compose stack
        if: always()
        run: pnpm --filter @offgrid/e2e e2e:stack:down
      - name: Add service logs to the job summary
        if: failure()
        run: |
          {
            echo "### Service logs (last 200 lines)"
            echo '```'
            tail -n 200 e2e/artifacts/service-logs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload traces and service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-failure-shard-${{ matrix.shard }}
          path: |
            e2e/artifacts/service-logs.txt
            e2e/artifacts/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: warn

  stack-guard:
    name: stack-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the stack changed
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...HEAD" 2>/dev/null) || changed=UNKNOWN
          if [ "$changed" = UNKNOWN ] || echo "$changed" | grep -Eq '^(infra/|apps/)|(^|/)Dockerfile[^/]*$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version-file: .nvmrc
      - name: Start the egress-blocked stack and check it
        if: steps.scope.outputs.relevant == 'true'
        run: node scripts/check-stack-egress.mjs
