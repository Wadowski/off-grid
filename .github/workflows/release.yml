name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  verify-tag:
    name: verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
      owner: ${{ steps.parse.outputs.owner }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - id: parse
        name: parse tag and owner
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "tag $TAG is not vX.Y.Z" >&2
            exit 1
          fi
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=$version"
            echo "owner=$owner"
          } >> "$GITHUB_OUTPUT"
      - name: check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: check that the version is not below the minimum update version
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          minimum=$(tr -d '[:space:]' < MINIMUM_UPDATE_FROM)
          highest=$(printf '%s\n%s\n' "$minimum" "$VERSION" | sort -V | tail -n 1)
          if [ "$highest" != "$VERSION" ]; then
            echo "version $VERSION is below the minimum update version $minimum" >&2
            exit 1
          fi
      - name: check that no release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "a release for $TAG already exists" >&2
            exit 1
          fi

  build-server:
    name: build and push server image
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        name: image tags
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ needs.verify-tag.outputs.owner }}/offgrid-main-server
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        name: build and push server image for amd64 and arm64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: apps/main-server/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OFFGRID_VERSION=${{ needs.verify-tag.outputs.version }}
          provenance: false
          sbom: false

  build-web:
    name: build and push web image
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        name: image tags
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ needs.verify-tag.outputs.owner }}/offgrid-main-web
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        name: build and push web image for amd64 and arm64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: apps/main-web/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OFFGRID_VERSION=${{ needs.verify-tag.outputs.version }}
          provenance: false
          sbom: false

  build-updater:
    name: build and push updater image
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        name: image tags
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ needs.verify-tag.outputs.owner }}/offgrid-updater
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        name: build and push updater image for amd64 and arm64
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: apps/updater/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OFFGRID_VERSION=${{ needs.verify-tag.outputs.version }}
          provenance: false
          sbom: false

  publish-release:
    name: publish GitHub release with manifest
    needs: [verify-tag, build-server, build-web, build-updater]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: write release manifest
        env:
          OFFGRID_RELEASE_VERSION: ${{ needs.verify-tag.outputs.version }}
          OFFGRID_RELEASE_COMMIT: ${{ github.sha }}
          OFFGRID_SERVER_DIGEST: ${{ needs.build-server.outputs.digest }}
          OFFGRID_WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
        run: node --import tsx scripts/release-manifest.mjs --out release-manifest.json
      - name: write install script assets and checksums
        run: |
          cp infra/compose/docker-compose.production.yml docker-compose.production.yml
          cp infra/compose/production.env.example production.env.example
          sha256sum docker-compose.production.yml production.env.example > SHA256SUMS
      - name: create GitHub release with the manifest and install assets attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-manifest.json docker-compose.production.yml production.env.example SHA256SUMS --verify-tag --title "OffGrid $TAG" --generate-notes
