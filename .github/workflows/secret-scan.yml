name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --config .gitleaks.toml --redact --verbose --exit-code 1 .
