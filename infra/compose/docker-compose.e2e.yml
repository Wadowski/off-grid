# Test-only override for the e2e stack. The scenarios share one server, so each one
# sends its own X-Forwarded-For address. The published port is bound to loopback, so
# only this machine can reach the stack, and the forwarded header is trusted only from
# loopback and the Docker bridge range. Never use this file for a real install.
name: offgrid

services:
  server:
    ports: !override
      - "127.0.0.1:${OFFGRID_SERVER_PORT:-3000}:3000"
    environment:
      OFFGRID_TRUSTED_PROXIES: "127.0.0.0/8,172.16.0.0/12"
      OFFGRID_CORS_ORIGINS: "http://127.0.0.1:${OFFGRID_WEB_PORT:-5173}"

  web:
    ports: !override
      - "127.0.0.1:${OFFGRID_WEB_PORT:-5173}:8080"

  mail:
    image: axllent/mailpit:v1.31.6
    restart: "no"
    ports:
      - "127.0.0.1:${OFFGRID_MAIL_UI_PORT:-8025}:8025"
