name: offgrid

services:
  server:
    ports: !override
      - "127.0.0.1:${OFFGRID_SERVER_PORT:-3000}:3000"
    environment:
      OFFGRID_TRUSTED_PROXIES: "127.0.0.0/8,172.16.0.0/12"
      OFFGRID_CORS_ORIGINS: "http://127.0.0.1:${OFFGRID_WEB_PORT:-5173}"
      OFFGRID_FILES_MAX_UPLOAD_BYTES: "${OFFGRID_FILES_MAX_UPLOAD_BYTES:-1048576}"
    volumes:
      - ../../data/files-e2e:/data/files

  web:
    ports: !override
      - "127.0.0.1:${OFFGRID_WEB_PORT:-5173}:8080"

  mail:
    image: axllent/mailpit:v1.31.6
    restart: "no"
    ports:
      - "127.0.0.1:${OFFGRID_MAIL_UI_PORT:-8025}:8025"

  updater:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OFFGRID_UPDATER_COMPOSE_PROJECT: ${E2E_COMPOSE_PROJECT:-offgrid-e2e-local}
      OFFGRID_UPDATER_RELEASE_REPOSITORY: offgrid-e2e/offgrid
      OFFGRID_UPDATER_RELEASE_API_BASE_URL: https://host.docker.internal:${E2E_RELEASE_SOURCE_PORT:-18443}
      OFFGRID_UPDATER_IMAGE_REGISTRY: 127.0.0.1:${E2E_REGISTRY_PORT:-5000}
      OFFGRID_UPDATER_HEALTH_TIMEOUT_SECONDS: 30
      NODE_EXTRA_CA_CERTS: /etc/offgrid-e2e/ca.pem
    volumes: !override
      - ../../data/secrets:/run/secrets:ro
      - offgrid-e2e-backups:/backups
      - offgrid-updater:/var/lib/offgrid-updater
      - ${OFFGRID_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ../../e2e/artifacts/release-source/ca.pem:/etc/offgrid-e2e/ca.pem:ro

  registry:
    image: registry:2
    restart: "no"
    ports:
      - "127.0.0.1:${E2E_REGISTRY_PORT:-5000}:5000"

volumes:
  offgrid-e2e-backups:
