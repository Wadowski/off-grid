name: offgrid

x-server-image: &server-image offgrid-main-server:${OFFGRID_VERSION:-local}
x-server-build: &server-build
  context: ../..
  dockerfile: apps/main-server/Dockerfile

services:
  secrets-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "/init/secrets-init.sh"]
    volumes:
      - ../../data:/data
      - ./secrets-init.sh:/init/secrets-init.sh:ro

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: offgrid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - offgrid-db:/var/lib/postgresql/data
      - ../../data/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ../../data/secrets/migrator-password:/run/secrets/migrator-password:ro
      - ../../data/secrets/app-password:/run/secrets/app-password:ro
      - ../init/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d offgrid"]
      interval: 5s
      retries: 30
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  init:
    image: *server-image
    build: *server-build
    restart: "no"
    command: ["node", "--import", "tsx", "src/migrate.ts"]
    environment:
      OFFGRID_DATABASE_HOST: db
      OFFGRID_DATABASE_NAME: offgrid
      OFFGRID_DATABASE_USER: offgrid_migrator
      OFFGRID_DATABASE_PASSWORD_FILE: /run/secrets/migrator-password
      OFFGRID_MAIL_ENCRYPTION_KEY_FILE: /run/secrets/mail-encryption-key
    volumes:
      - ../../data/secrets/migrator-password:/run/secrets/migrator-password:ro
      - ../../data/secrets/mail-encryption-key:/run/secrets/mail-encryption-key:ro
    depends_on:
      db:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully

  server:
    image: *server-image
    build: *server-build
    restart: unless-stopped
    environment:
      OFFGRID_HTTP_HOST: 0.0.0.0
      OFFGRID_HTTP_PORT: 3000
      OFFGRID_DATABASE_HOST: db
      OFFGRID_DATABASE_NAME: offgrid
      OFFGRID_DATABASE_USER: offgrid_app
      OFFGRID_DATABASE_PASSWORD_FILE: /run/secrets/app-password
      OFFGRID_MAIL_ENCRYPTION_KEY_FILE: /run/secrets/mail-encryption-key
      OFFGRID_CORS_ORIGINS: ${OFFGRID_CORS_ORIGINS:-http://localhost:8080}
      TZ: ${TZ:-UTC}
    volumes:
      - ../../data/secrets/app-password:/run/secrets/app-password:ro
      - ../../data/secrets/mail-encryption-key:/run/secrets/mail-encryption-key:ro
    ports:
      - "${OFFGRID_SERVER_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      retries: 6
    depends_on:
      init:
        condition: service_completed_successfully

  web:
    image: offgrid-main-web:${OFFGRID_VERSION:-local}
    build:
      context: ../..
      dockerfile: apps/main-web/Dockerfile
      args:
        VITE_API_ORIGIN: ${OFFGRID_API_ORIGIN:-}
    restart: unless-stopped
    ports:
      - "${OFFGRID_WEB_PORT:-8080}:8080"

volumes:
  offgrid-db:
