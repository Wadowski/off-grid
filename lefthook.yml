pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --config .gitleaks.toml --no-banner
      fail_text: "gitleaks found a possible secret in the staged changes, or gitleaks is not installed. See CONTRIBUTING.md."
